components:
  schemas:
    AssignTaskRequest:
      type: object
      properties:
        assigneeId:
          type: string
        assigneeName:
          type: string
        plannedTestDate:
          type: string
    AuthContext:
      type: object
      required:
        - state
      properties:
        state:
          allOf:
            - $ref: '#/components/schemas/AuthState'
          description: 当前 auth 状态
      description: AuthContext 数据契约。方法(login/logout/refresh/switchTenant/hasPermission/onChange)由消费方实现,TS 签名见 .state/decision-log.md §2.2
    AuthHeaderKind:
      type: string
      enum:
        - Authorization
        - X-Auth-Token
      description: 已废弃 (ADR-0014)
    AuthState:
      type: object
      oneOf:
        - $ref: '#/components/schemas/AuthStateIdle'
        - $ref: '#/components/schemas/AuthStateAnonymous'
        - $ref: '#/components/schemas/AuthStateAwaiting_tenant'
        - $ref: '#/components/schemas/AuthStateAuthenticated'
      discriminator:
        propertyName: kind
        mapping:
          idle: '#/components/schemas/AuthStateIdle'
          anonymous: '#/components/schemas/AuthStateAnonymous'
          awaiting_tenant: '#/components/schemas/AuthStateAwaiting_tenant'
          authenticated: '#/components/schemas/AuthStateAuthenticated'
      description: 'auth 状态机 4 态。Vue: pinia store / React: Context;两侧实现可同构'
    AuthStateAnonymous:
      type: object
      required:
        - kind
        - value
      properties:
        kind:
          type: string
          enum:
            - anonymous
        value:
          type: object
          properties:
            kind:
              type: string
              enum:
                - anonymous
          required:
            - kind
    AuthStateAuthenticated:
      type: object
      required:
        - kind
        - value
      properties:
        kind:
          type: string
          enum:
            - authenticated
        value:
          type: object
          properties:
            kind:
              type: string
              enum:
                - authenticated
            user:
              $ref: '#/components/schemas/CurrentUser'
            tenant:
              $ref: '#/components/schemas/MyTenant'
            permissions:
              type: array
              items:
                type: string
            tokenExpiresAt:
              type: integer
              format: int64
              description: unix ms
          required:
            - kind
            - user
            - tenant
            - permissions
            - tokenExpiresAt
    AuthStateAwaiting_tenant:
      type: object
      required:
        - kind
        - value
      properties:
        kind:
          type: string
          enum:
            - awaiting_tenant
        value:
          type: object
          properties:
            kind:
              type: string
              enum:
                - awaiting_tenant
            user:
              $ref: '#/components/schemas/CurrentUser'
            tenants:
              type: array
              items:
                $ref: '#/components/schemas/MyTenant'
          required:
            - kind
            - user
            - tenants
    AuthStateIdle:
      type: object
      required:
        - kind
        - value
      properties:
        kind:
          type: string
          enum:
            - idle
        value:
          type: object
          properties:
            kind:
              type: string
              enum:
                - idle
          required:
            - kind
    BackendConfig:
      type: object
      required:
        - id
        - label
        - baseUrl
        - authHeader
        - features
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/BackendId'
          description: 槽位标识,必须是 BackendId 之一
        label:
          type: string
          description: 显示名(MSW Mock / Next.js API / Spring Boot / ASP.NET Core)
        baseUrl:
          type: string
          description: baseUrl 的展示值,例如 'http://localhost:5201/api'
        authHeader:
          allOf:
            - $ref: '#/components/schemas/AuthHeaderKind'
          description: token 头:Bearer 走 Authorization,部分老后端用 X-Auth-Token
        ssoCallbackPath:
          type: string
          description: SSO 回调路径(仅启用 SSO 的后端填写)
        features:
          allOf:
            - $ref: '#/components/schemas/BackendFeatures'
          description: 能力矩阵
      description: 已废弃 (ADR-0014):用 VITE_API_BASE_URL / NEXT_PUBLIC_API_BASE_URL 替代;4-backend 运行时切换配置
    BackendFeatures:
      type: object
      required:
        - sso
        - realDb
      properties:
        sso:
          type: boolean
          description: 是否启用 SSO 跳转(nextjs=true / springboot/aspnetcore 视实现)
        realDb:
          type: boolean
          description: 是否对接真实数据库(vs mock seed)
      description: 已废弃 (ADR-0014);后端能力矩阵
    BackendId:
      type: string
      enum:
        - nextjs
        - springboot
        - aspnetcore
      description: 已废弃 (ADR-0014);3 个槽位,id 锁定避免拼写漂移。msw 成员 2026-09-17 随 msw 仓剔除删除
