name: ci

# lab-management-system-kotlin (Kotlin 2.x + ktor Netty, JVM 21)
# 家族原则（镜像 saas-kotlin ci.yml 注释）：CI=门内静态三件(ktfmt/detekt/test
# + env 显式注入) + 镜像装配冒烟；suite gate=全量（本地跑）。
# 与 saas-kotlin 差异：测试无真 PG 依赖（DB 未接线，测试自供 env——env 全量显式
# 注入 16 键，suite 硬规则 §1：占位也是显式提供），无 postgres service。
on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: L1/L2/L4 — ktfmtCheck + detekt + test（env 与 .env.example 同形显式注入）
        env:
          SERVER_PORT: "5209"
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54321/lab_dev
          JWT_SIGNING_KEY: dev-key-32-bytes-minimum-length!
          JWT_ISSUER: lab-management-system
          JWT_TTL_SECONDS: "3600"
          JWT_REFRESH_TTL_SECONDS: "604800"
          LAB_SAAS_BASE_URL: http://localhost:5101
          LAB_SSO_LOGIN_URL: http://localhost:5101
          LAB_SAAS_CLIENT_ID: lab-management
          LAB_SAAS_CLIENT_SECRET: lab-management-secret
          LAB_SAAS_DEFAULT_TENANT_ID: 00000000-0000-0000-0000-000000000001
          LAB_SSO_CALLBACK_REDIRECT: http://localhost:5202/login
          LAB_SAAS_SERVICE_USER: alice
          LAB_SAAS_SERVICE_PASSWORD: dev123456
          LAB_SAAS_SERVICE_CLIENT_ID: lab-management
          LAB_CORS_ALLOWED_ORIGINS: http://localhost:5201,http://localhost:5202,http://localhost:5203,http://localhost:5101,http://localhost:5208
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon ktfmtCheck detekt test

      - name: 镜像装配冒烟 — build + run + /health + swagger 文档面 200
        # 直接构建 prod 同款镜像并拉起，探 /health + swagger 文档面三件（REQ-2026-003：
        # /api-docs 壳页 + openapi.yaml 契约 + webjar 静态件）。16 键占位显式提供，
        # 装配期不触库，/health 不消费 DB（AppConfig 只 fail-fast 校验键存在）。
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@127.0.0.1:54321/placeholder
          JWT_SIGNING_KEY: dev-key-32-bytes-minimum-length!
          LAB_SAAS_CLIENT_SECRET: placeholder
          LAB_SAAS_SERVICE_PASSWORD: placeholder
        run: |
          chmod +x gradlew
          docker build -t ktor-smoke .
          docker rm -f ktor-smoke >/dev/null 2>&1 || true
          docker run -d --name ktor-smoke -p 127.0.0.1:5209:5209 \
            --env SERVER_PORT=5209 --env DATABASE_URL="$DATABASE_URL" \
            --env JWT_SIGNING_KEY="$JWT_SIGNING_KEY" \
            --env JWT_ISSUER=lab-management-system \
            --env JWT_TTL_SECONDS=3600 \
            --env JWT_REFRESH_TTL_SECONDS=604800 \
            --env LAB_SAAS_BASE_URL=http://localhost:5101 \
            --env LAB_SSO_LOGIN_URL=http://localhost:5101 \
            --env LAB_SAAS_CLIENT_ID=lab-management \
            --env LAB_SAAS_CLIENT_SECRET="$LAB_SAAS_CLIENT_SECRET" \
            --env LAB_SAAS_DEFAULT_TENANT_ID=00000000-0000-0000-0000-000000000001 \
            --env LAB_SSO_CALLBACK_REDIRECT=http://localhost:5202/login \
            --env LAB_SAAS_SERVICE_USER=alice \
            --env LAB_SAAS_SERVICE_PASSWORD="$LAB_SAAS_SERVICE_PASSWORD" \
            --env LAB_SAAS_SERVICE_CLIENT_ID=lab-management \
            --env LAB_CORS_ALLOWED_ORIGINS=http://localhost:5201 ktor-smoke
          ok=""
          for i in $(seq 1 60); do
            body="$(curl -fsS --max-time 3 http://127.0.0.1:5209/health 2>/dev/null || true)"
            if [ -n "$body" ]; then
              echo "→ /health: $body"
              echo "$body" | grep -q '"ok":true' && ok=1 && break
            fi
            sleep 1
          done
          if [ -z "$ok" ]; then
            echo "ERROR: ktor smoke /health 未 200（60s 上限），容器日志:" >&2
            docker logs ktor-smoke 2>&1 | tail -40 >&2
            docker rm -f ktor-smoke >/dev/null 2>&1 || true
            exit 1
          fi
          # swagger 文档面探针（REQ-2026-003）：壳页 + 契约 + webjar 静态件三件全 200 才放行
          docs="$(curl -fsS --max-time 3 -o /dev/null -w '%{http_code}' http://127.0.0.1:5209/api-docs/openapi.yaml 2>/dev/null || true)"
          shell="$(curl -fsS --max-time 3 -o /dev/null -w '%{http_code}' http://127.0.0.1:5209/api-docs 2>/dev/null || true)"
          ui="$(curl -fsS --max-time 3 -o /dev/null -w '%{http_code}' http://127.0.0.1:5209/swagger-ui/5.34.0/swagger-ui.css 2>/dev/null || true)"
          echo "→ /api-docs/openapi.yaml=$docs /api-docs=$shell /swagger-ui/5.34.0/swagger-ui.css=$ui"
          if [ "$docs" != "200" ] || [ "$shell" != "200" ] || [ "$ui" != "200" ]; then
            echo "ERROR: swagger 文档面探针非 200，容器日志:" >&2
            docker logs ktor-smoke 2>&1 | tail -40 >&2
            docker rm -f ktor-smoke >/dev/null 2>&1 || true
            exit 1
          fi
          docker rm -f ktor-smoke >/dev/null 2>&1 || true

  # 部署链（lab X09=5209；镜像 saas-kotlin deploy job，tag push 触发）:
  #   docker build & push（latest + tag 双份）→ VPS deploy 脚本拉镜像 + 渲染 nginx vhost
  #   + 起容器 + /health 探活。kotlin.env 首启由 deploy 脚本从 SSH 透传 secrets 自举。
  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    concurrency:
      group: deploy-${{ github.event.repository.name }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}:${{ github.ref_name }}

      - name: Pull image and restart container on VPS
        uses: appleboy/ssh-action@v1
        # appleboy/ssh-action@v1 的 ${{ secrets.* }} 不会自动进 SSH 远端 shell;
        # step env 注入 Actions env,with.envs 列出要转发的名字 (逗号分隔)。
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SIGNING_KEY: ${{ secrets.JWT_SIGNING_KEY }}
          LAB_SAAS_CLIENT_SECRET: ${{ secrets.LAB_SAAS_CLIENT_SECRET }}
          LAB_SAAS_SERVICE_PASSWORD: ${{ secrets.LAB_SAAS_SERVICE_PASSWORD }}
          NGINX_DOMAIN: ${{ vars.NGINX_DOMAIN }}
          NGINX_CERT_BASENAME: ${{ vars.NGINX_CERT_BASENAME }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: DATABASE_URL,JWT_SIGNING_KEY,LAB_SAAS_CLIENT_SECRET,LAB_SAAS_SERVICE_PASSWORD,NGINX_DOMAIN,NGINX_CERT_BASENAME
          script: |
            # 自举: 首次部署无 /home/deploy/<repo>/ 时自动建 + 拉 deploy 脚本
            set -e
            REPO="${{ github.event.repository.name }}"
            DEPLOY_DIR="/home/deploy/$REPO"
            mkdir -p "$DEPLOY_DIR"
            cd "$DEPLOY_DIR"
            # 总是重拉最新 deploy 脚本（脚本 bug fix 立即生效）；nginx 模板由脚本自拉
            curl -fsSL "https://raw.githubusercontent.com/zcqiand/${REPO}/refs/heads/master/deploy/${REPO}.sh" -o "$REPO.sh"
            chmod +x "$REPO.sh"
            # 缺 kotlin.env 时, deploy 脚本从 SSH env 透传的 secrets 自举
            # (UMASK 077, chmod 600)。后续 deploy 不需要这些 env (env-file 已存在)。
            echo "→ env on remote: DATABASE_URL_set=$([ -n \"${DATABASE_URL:-}\" ] && echo yes || echo no)"
            if [ ! -f "kotlin.env" ] && [ -z "${DATABASE_URL:-}" ]; then
              echo "ERROR: kotlin.env missing AND DATABASE_URL secret not forwarded, deploy script will fail-fast" >&2
            fi
            sh "$REPO.sh" "${{ secrets.DOCKER_USERNAME }}" "${{ secrets.DOCKER_PASSWORD }}" "${{ github.ref_name }}"
