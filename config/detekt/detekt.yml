build:
  maxIssues: 0
complexity:
  TooManyFunctions:
    active: true
    excludes: ['**/HarnessTraceListener.kt', '**/AuthApiServiceImpl.kt']
    # HarnessTraceListener：porter 类职责单一，10 个小私有方法是形态本身（Phase 1 终审修复项）
    # AuthApiServiceImpl：auth 会话链镜像 fastapi auth_impl 单模块——10 个 contract op + 镜像
    # helper 同住一类是 delegate 缝的形态本身（ADR-0047），拆类反而断开镜像对照（Phase 5 终验）
  LongParameterList:
    active: true
    constructorThreshold: 8
    # AuthApiServiceImpl 7 依赖镜像 fastapi auth_impl 模块依赖面（cfg+directory+jwt+双 saas
    # 客户端+双快照），造 deps 包装层是纯仪式（Phase 5 终验）
